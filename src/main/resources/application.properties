spring.application.name=backendpetsalud

# --- Base de datos (perfil por defecto: H2 en archivo, sin instalar nada) ---
spring.datasource.url=jdbc:h2:file:./data/petsalud-s3;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Consola H2 deshabilitada: expondría la base de datos
spring.h2.console.enabled=false

# --- Seguridad ---
# Usuarios de demostración (admin/vet/cliente @petsalud.cl). Desactivar en producción.
petsalud.seed.enabled=true
petsalud.seed.password=${PETSALUD_SEED_PASSWORD:Petsalud2025}
# JWT: clave HMAC en Base64 (>= 256 bits). En producción se entrega por la variable de entorno JWT_SECRET.
# El valor por defecto es SOLO para desarrollo local; no usar en producción.
petsalud.jwt.secret=${JWT_SECRET:/5D/an0COt+WzIoo+ObvilSLoJoi9w8pisobgHo1f/o=}
petsalud.jwt.issuer=petsalud-backend
petsalud.jwt.expiracion-minutos=30
# Bloqueo temporal de la cuenta tras N intentos fallidos
petsalud.seguridad.max-intentos=5
petsalud.seguridad.bloqueo-minutos=15

# --- Errores: no filtrar mensajes ni trazas internas al cliente ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Logs ---
logging.level.AUDITORIA_SEGURIDAD=INFO
