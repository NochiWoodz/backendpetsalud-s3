# Perfil de producción: activar con  --spring.profiles.active=mysql
# Las credenciales NO van en el repositorio: se entregan como variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsalud_db?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
# En producción no se crean usuarios de demostración
petsalud.seed.enabled=false

# La clave JWT es obligatoria y NO tiene valor por defecto en producción (la app no inicia sin ella)
petsalud.jwt.secret=${JWT_SECRET}
